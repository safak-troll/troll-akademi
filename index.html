<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şafak'ın Sitesi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 50px;
            margin: 0;
            min-height: 100vh;
        }
        h1 { font-size: 48px; margin-bottom: 10px; }
        p { font-size: 20px; opacity: 0.9; }
        .kutu {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 30px;
        }
        button {
            background: white;
            color: #764ba2;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background: #f0f0f0; }
    </style>
</head>
<body>
    <div class="kutu">
        <h1>Merhaba! 👋</h1>
        <p>Ben Şafak. Bu benim ilk sitem.</p>
        <p>Ve şu an kod yazmayı öğreniyorum! 🚀</p>
        <button onclick="alert('Teşekkürler! 😊')">Bana Tıkla</button>
    </div>
</body>
</html>
